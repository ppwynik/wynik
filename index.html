<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licznik</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(600px, 92%);
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #9ca3af;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      padding: 15px 10px;
      background: #111827;
      border-radius: 12px;
      text-align: center;
    }

    .stat-title {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: bold;
    }

    .counter {
      text-align: center;
      font-size: 80px;
      font-weight: bold;
      margin: 30px 0 10px;
    }

    .result {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .hint {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      margin-top: 15px;
    }

    @media (max-width: 500px) {
      .inputs,
      .stats {
        grid-template-columns: 1fr;
      }

      .counter {
        font-size: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Wynik</h1>

    <div class="inputs">

      <div>
        <label for="startDate">Data</label>
        <input type="date" id="startDate">
      </div>

      <div>
        <label for="startTime">Godzina</label>
        <input type="time" id="startTime" step="1">
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Czas Pracy</div>
        <div class="stat-value" id="elapsed">0,00 h</div>
      </div>

      <div class="stat">
        <div class="stat-title">Licznik</div>
        <div class="stat-value" id="counterSmall">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Wynik</div>
        <div class="stat-value" id="rateSmall">0,00/h</div>
      </div>

    </div>

    <div class="counter" id="counter">
      0
    </div>

    <div class="result" id="result">
      0,00 / h
    </div>

    <div class="buttons">
      <button id="resetButton">
        
      </button>
    </div>

  </div>

  <script>

    const startDate = document.getElementById("startDate");
    const startTime = document.getElementById("startTime");

    const counterElement = document.getElementById("counter");
    const counterSmall = document.getElementById("counterSmall");

    const elapsedElement = document.getElementById("elapsed");

    const resultElement = document.getElementById("result");
    const rateSmall = document.getElementById("rateSmall");

    const resetButton = document.getElementById("resetButton");

    let counter = 0;


    // Ustawienie dzisiejszej daty
    // oraz domyślnej godziny 18:30
    function setDefaultDateTime() {

      const now = new Date();

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      startDate.value = `${year}-${month}-${day}`;

      // Domyślna godzina
      startTime.value = "18:30";
    }


    // Pobiera wybraną datę i godzinę
    function getStartDate() {

      if (!startDate.value || !startTime.value) {
        return null;
      }

      const [year, month, day] =
        startDate.value.split("-").map(Number);

      const [hours, minutes, seconds] =
        startTime.value.split(":").map(Number);

      return new Date(
        year,
        month - 1,
        day,
        hours,
        minutes,
        seconds || 0
      );
    }


    // Aktualizacja wszystkich wartości
    function update() {

      const start = getStartDate();

      if (!start) {
        return;
      }

      let elapsedMilliseconds =
        Date.now() - start.getTime();

      // Jeżeli godzina jest jeszcze w przyszłości,
      // pokazujemy 0 zamiast wartości ujemnej.
      if (elapsedMilliseconds < 0) {
        elapsedMilliseconds = 0;
      }

      // Zamiana czasu na godziny
      const elapsedHours =
        elapsedMilliseconds / 3600000;


      // GŁÓWNY WZÓR:
      //
      // Counter / liczba godzin
      //
      // Przykład:
      // Counter = 20
      // Czas = 1,2 h
      // 20 / 1,2 = 16,67 / h

      let result = 0;

      if (elapsedHours > 0) {
        result = counter / elapsedHours;
      }


      // Wyświetlanie czasu
      elapsedElement.textContent =
        elapsedHours.toFixed(2).replace(".", ",") + " h";


      // Wyświetlanie Counter
      counterElement.textContent =
        counter;

      counterSmall.textContent =
        counter;


      // Wyświetlanie wyniku
      rateSmall.textContent =
        result.toFixed(2).replace(".", ",") + "/h";

      resultElement.textContent =
        result.toFixed(2).replace(".", ",") + " / h";
    }


    // Spacja zwiększa Counter
    document.addEventListener("keydown", function(event) {

      // Nie reaguj na spację podczas wpisywania
      // w pole daty/godziny
      if (event.target.tagName === "INPUT") {
        return;
      }

      if (event.code === "Space") {

        event.preventDefault();

        counter++;

        update();
      }

    });


    // Reset Counter
    resetButton.addEventListener("click", function() {

      counter = 0;

      update();

    });


    // Zmiana daty resetuje Counter
    startDate.addEventListener("change", function() {

      counter = 0;

      update();

    });


    // Zmiana godziny resetuje Counter
    startTime.addEventListener("change", function() {

      counter = 0;

      update();

    });


    // Ustawienie dzisiejszej daty
    // i godziny 18:30
    setDefaultDateTime();


    // Aktualizacja co 250 ms
    setInterval(update, 250);

    // Pierwsze obliczenie
    update();

  </script>

</body>
</html>
